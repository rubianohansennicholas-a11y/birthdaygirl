<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A letter for Francilene</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { --w: min(88vw, 380px); --h: calc(var(--w) * .76); --ink: #4a2040; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; display: flex; overflow-x: hidden;
    font-family: 'Quicksand', 'Trebuchet MS', sans-serif;
    background: radial-gradient(ellipse at 50% 30%, #5b2468 0%, #2a1033 72%) fixed;
  }

  /* floating background hearts + effects layer */
  #bg, #fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  #bg { z-index: 0; }
  #fx { z-index: 25; }
  #bg b, #fx b { position: absolute; font-weight: 400; line-height: 1; }
  #bg b { bottom: -40px; }
  #fx i { position: absolute; top: 0; width: 8px; height: 14px; border-radius: 2px; }

  /* ---------- gate: "do you accept this letter?" ---------- */
  .gate {
    position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 20px;
    transition: opacity .6s, transform .6s, visibility 0s .6s;
  }
  .gate.gone { opacity: 0; transform: scale(1.12); visibility: hidden; pointer-events: none; }
  .card {
    width: min(92vw, 420px); padding: 34px 26px 38px; text-align: center; color: #fbe3ec;
    background: rgba(255,255,255,.07); border: 1px solid rgba(247,168,196,.35); border-radius: 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,.35); animation: fadein .9s both;
  }
  .beat { font-size: 58px; line-height: 1; color: #ff6f91; text-shadow: 0 0 26px rgba(255,111,145,.75); animation: beat 1.3s ease-in-out infinite; }
  .card h1 { font-family: 'Dancing Script', cursive; font-weight: 700; font-size: clamp(2rem, 8vw, 2.6rem); line-height: 1.1; margin: 14px 0 8px; }
  .card p { margin: 0; font-weight: 500; font-size: .98rem; color: #f6c9da; min-height: 1.5em; }
  .row { display: flex; justify-content: center; align-items: center; gap: 22px; margin-top: 34px; min-height: 58px; }
  .row button {
    font: 600 1rem 'Quicksand', sans-serif; padding: 12px 28px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  }
  .yes {
    border: 0; color: #fff; background: linear-gradient(135deg, #ff7aa5, #ff4f86);
    box-shadow: 0 6px 18px rgba(255,79,134,.45); transform: scale(var(--ys, 1)); transition: transform .35s cubic-bezier(.3,1.5,.5,1);
  }
  .yes:hover { transform: scale(calc(var(--ys, 1) * 1.06)); }
  .no { background: transparent; border: 1.5px solid #f6c9da; color: #f6c9da; transform: scale(var(--ns, 1)); transition: left .35s cubic-bezier(.3,1.4,.5,1), top .35s cubic-bezier(.3,1.4,.5,1), transform .3s; }
  .no.run { position: fixed; z-index: 30; margin: 0; }
  .no.final { border: 0; color: #fff; background: linear-gradient(135deg, #ff7aa5, #ff4f86); box-shadow: 0 6px 18px rgba(255,79,134,.45); }
  button:focus-visible { outline: 3px solid #ffd36b; outline-offset: 4px; }

  /* ---------- envelope stage ---------- */
  .stage {
    position: relative; z-index: 1; margin: auto; display: flex; flex-direction: column; align-items: center;
    padding: calc(var(--h) * 1.05) 16px 30px; visibility: hidden; opacity: 0; transition: opacity .4s;
  }
  .stage.show { visibility: visible; opacity: 1; }
  .stage.show .drop { animation: drop 1s cubic-bezier(.3,.7,.3,1) both; }
  .drop { position: relative; }
  .glow {
    position: absolute; left: 50%; top: 50%; width: calc(var(--w) * 1.9); aspect-ratio: 1; z-index: -1; pointer-events: none;
    background: radial-gradient(circle, rgba(255,150,190,.5), transparent 62%);
    opacity: 0; transform: translate(-50%, -68%) scale(.4); transition: opacity 1.2s, transform 1.4s cubic-bezier(.2,.8,.3,1);
  }
  .lit .glow { opacity: 1; transform: translate(-50%, -68%) scale(1); animation: glowpulse 3s ease-in-out 1.4s infinite; }

  .envelope {
    position: relative; display: block; width: var(--w); height: var(--h); padding: 0; border: 0; background: none; cursor: default;
    filter: drop-shadow(0 18px 24px rgba(0,0,0,.35)); animation: bob 3s ease-in-out infinite;
  }
  .envelope.open { animation: none; }
  .envelope.reading { cursor: pointer; }
  .envelope > span { position: absolute; }

  .back { inset: 0; background: #e98aa9; border-radius: 6px; z-index: 1; }
  .pocket {
    inset: 0; border-radius: 6px; z-index: 3;
    background: linear-gradient(135deg, #f6b3c8, #f09bb7);
    clip-path: polygon(0 0, 50% 58%, 100% 0, 100% 100%, 0 100%);
  }
  .pocket::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(0deg, #f9c9d8, #f4a9c0);
    clip-path: polygon(0 100%, 50% 58%, 100% 100%);
  }
  .flap {
    left: 0; top: 0; width: 100%; height: 58%; z-index: 5; transform-origin: 50% 0;
    background: linear-gradient(180deg, #f27fa3, #f598b6);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform: perspective(900px) rotateX(0deg);
    transition: transform .7s cubic-bezier(.5, 0, .2, 1), z-index 0s .35s, filter .7s;
  }
  .open .flap { transform: perspective(900px) rotateX(180deg); z-index: 1; filter: brightness(.86); }

  .seal {
    left: 50%; top: 58%; z-index: 6; width: calc(var(--w) * .13); aspect-ratio: 1;
    margin: calc(var(--w) * -.065) 0 0 calc(var(--w) * -.065); border-radius: 50%;
    display: grid; place-items: center; color: #8a5a10; font-size: calc(var(--w) * .06);
    background: radial-gradient(circle at 35% 30%, #ffe58f, #e0a93b 70%, #b57f1f);
    box-shadow: 0 2px 5px rgba(0,0,0,.3); transition: opacity .3s, transform .4s;
    animation: pulse 1.8s ease-in-out infinite;
  }
  .open .seal { opacity: 0; transform: scale(.4) rotate(40deg); animation: none; }

  .letter {
    left: 5%; top: 5%; width: 90%; height: 90%; z-index: 2; border-radius: 4px; background: #fffaf2;
    box-shadow: 0 2px 8px rgba(0,0,0,.18); transform-origin: 50% 100%;
    transition: transform 1s cubic-bezier(.3, .8, .3, 1);
  }
  .letter::after { content: ""; position: absolute; inset: 6px; border: 1.5px dashed #f2a4bd; border-radius: 3px; pointer-events: none; }
  .out .letter { transform: translateY(calc(var(--h) * -.6)); }
  .reading .letter { z-index: 7; transform: translateY(calc(var(--h) * -.8)) scale(1.18); }
  .reading .letter { animation: sway 4s ease-in-out 1.2s infinite; }

  .in { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 4% 7%; text-align: center; }
  .in > span { display: block; opacity: 0; transform: translateY(8px); transition: opacity .6s, transform .6s; }
  .reading .in > span { opacity: 1; transform: none; }
  .reading .in > span:nth-child(1) { transition-delay: .6s; }
  .reading .in > span:nth-child(2) { transition-delay: .9s; }
  .reading .in > span:nth-child(3) { transition-delay: 1.3s; }
  .reading .in > span:nth-child(4) { transition-delay: 1.7s; }

  .hb, .name, .sign { font-family: 'Dancing Script', cursive; }
  .hb { font-size: calc(var(--w) * .075); font-weight: 600; color: #b43a6b; }
  .name {
    font-size: calc(var(--w) * .125); font-weight: 700; line-height: 1.1; margin: .05em 0 .2em;
    background: linear-gradient(90deg, #4a2040 20%, #d4478b 50%, #4a2040 80%); background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
    animation: shine 3.5s linear infinite;
  }
  .msg { font-size: calc(var(--w) * .037); font-weight: 500; line-height: 1.42; color: #5b3a55; max-width: 36ch; }
  .sign { font-size: calc(var(--w) * .055); color: #b43a6b; margin-top: .4em; }

  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes beat { 0%, 60%, 100% { transform: scale(1); } 15% { transform: scale(1.22); } 30% { transform: scale(1); } 45% { transform: scale(1.12); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
  @keyframes drop {
    0% { opacity: 0; transform: translateY(-70vh) rotate(-10deg) scale(.7); }
    60% { opacity: 1; transform: translateY(12px) rotate(3deg) scale(1.02); }
    100% { opacity: 1; transform: none; }
  }
  @keyframes sway { 0%, 100% { rotate: -.8deg; } 50% { rotate: .8deg; } }
  @keyframes shine { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  @keyframes glowpulse { 0%, 100% { opacity: 1; } 50% { opacity: .65; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01s !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
  <div id="bg" aria-hidden="true"></div>

  <section class="gate" id="gate" aria-live="polite">
    <div class="card">
      <div class="beat" id="beat">♥</div>
      <h1 id="q">Do you accept this letter?</h1>
      <p id="sub">It’s written just for you, Francilene.</p>
      <div class="row">
        <button class="yes" id="yes">Yes</button>
        <span class="slot" id="slot"><button class="no" id="no">No</button></span>
      </div>
    </div>
  </section>

  <main class="stage" id="stage">
    <div class="drop" id="drop">
      <span class="glow"></span>
      <button class="envelope" id="env" aria-label="Birthday letter for Francilene">
        <span class="back"></span>
        <span class="letter">
          <span class="in">
            <span class="hb">Happy Birthday,</span>
            <span class="name">Francilene!</span>
            <span class="msg">Thank you for being my happy pill. I’m so happy and grateful that I met you. I wish you the best of luck on your journey, and enjoy your special day, Franky.</span>
            <span class="sign">With love ♥</span>
          </span>
        </span>
        <span class="pocket"></span>
        <span class="flap"></span>
        <span class="seal">♥</span>
      </button>
    </div>
  </main>

  <div id="fx" aria-hidden="true"></div>

<script>
  const $ = id => document.getElementById(id);
  const gate = $('gate'), q = $('q'), sub = $('sub'), yes = $('yes'), no = $('no'), slot = $('slot'), beat = $('beat');
  const stage = $('stage'), env = $('env'), drop = $('drop'), fx = $('fx'), bg = $('bg');
  const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const pal = ['#ff6f91', '#f7a8c4', '#ffd36b', '#c9a7ff', '#ffffff'];
  const confettiColors = ['#f7a8c4', '#ffd36b', '#ffffff', '#c9a7ff', '#ff6f91'];
  const R = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];

  /* ----- hearts & confetti ----- */
  function hearts(n, cx, cy, spread) {
    if (calm) return;
    for (let i = 0; i < n; i++) {
      const h = document.createElement('b');
      h.textContent = '♥';
      h.style.left = cx + 'px'; h.style.top = cy + 'px';
      h.style.fontSize = R(14, 36) + 'px'; h.style.color = pick(pal);
      fx.appendChild(h);
      const a = R(0, Math.PI * 2), d = spread * R(.4, 1);
      const dx = Math.cos(a) * d, dy = Math.sin(a) * d - 30;
      h.animate([
        { transform: 'translate(-50%,-50%) scale(.2)', opacity: 0 },
        { transform: `translate(calc(-50% + ${dx * .7}px), calc(-50% + ${dy * .7}px)) scale(1)`, opacity: 1, offset: .35 },
        { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy - 170}px)) scale(.8) rotate(${R(-50, 50)}deg)`, opacity: 0 }
      ], { duration: R(1800, 3000), easing: 'ease-out', delay: R(0, 250) }).onfinish = () => h.remove();
    }
  }
  function burstAtEnv(n) {
    const r = env.getBoundingClientRect();
    hearts(n, r.left + r.width / 2, r.top + r.height * .35, Math.min(innerWidth, 440) * .7);
  }
  function confetti() {
    if (calm) return;
    for (let i = 0; i < 90; i++) {
      const p = document.createElement('i');
      p.style.left = R(0, innerWidth) + 'px';
      p.style.background = confettiColors[i % confettiColors.length];
      fx.appendChild(p);
      p.animate([
        { transform: 'translate(0,-20px) rotate(0deg)', opacity: 1 },
        { transform: `translate(${R(-110, 110)}px, ${innerHeight + 30}px) rotate(${360 + R(0, 540)}deg)`, opacity: 1 }
      ], { duration: R(2500, 4500), delay: R(0, 600), easing: 'cubic-bezier(.3,.5,.6,1)', fill: 'forwards' }).onfinish = () => p.remove();
    }
  }
  function floaty(pre) {
    if (calm) return;
    const h = document.createElement('b');
    h.textContent = '♥';
    h.style.left = R(0, 100) + 'vw'; h.style.fontSize = R(12, 30) + 'px'; h.style.color = pick(pal);
    bg.appendChild(h);
    const dur = R(9000, 15000);
    h.animate([
      { transform: 'translate(0,0) rotate(0deg)', opacity: 0 },
      { opacity: R(.18, .42), offset: .15 },
      { transform: `translate(${R(-70, 70)}px, -115vh) rotate(${R(-40, 40)}deg)`, opacity: 0 }
    ], { duration: dur, easing: 'linear', delay: pre ? -R(0, dur * .8) : 0 }).onfinish = () => h.remove();
  }
  for (let i = 0; i < 10; i++) floaty(true);
  setInterval(floaty, 650);

  /* ----- the gate: "no" eventually becomes "yes" ----- */
  const lines = [
    ['Do you accept this letter?', 'It’s written just for you, Francilene.'],
    ['Are you really sure?', 'It took a while to write this.'],
    ['The letter is looking sad…', 'Look how patiently it’s waiting.'],
    ['Think about it again.', 'The yes button is growing for a reason.'],
    ['Pretty please?', 'Just one little yes.'],
    ['Okay, you know you want to.', 'Go on. It’s only a letter full of love.']
  ];
  const noText = ['No', 'Are you sure?', 'Really?', 'Think again…', 'Pretty please?', 'Okay… yes ♥'];
  const LIMIT = 5;
  let n = 0, accepted = false, state = 0;

  function dodge() {
    if (n >= LIMIT || accepted) return;
    if (!no.classList.contains('run')) {
      const r = no.getBoundingClientRect();
      slot.style.width = r.width + 'px'; slot.style.height = r.height + 'px';
      no.style.left = r.left + 'px'; no.style.top = r.top + 'px';
      no.classList.add('run');
      void no.offsetWidth;
    }
    n++;
    q.textContent = lines[n][0]; sub.textContent = lines[n][1]; no.textContent = noText[n];
    yes.style.setProperty('--ys', Math.min(1 + n * .14, 1.7));
    no.style.setProperty('--ns', Math.max(1 - n * .09, .6));
    if (n >= 2) beat.textContent = '♡';
    if (n === LIMIT) { finalize(); return; }
    const r = no.getBoundingClientRect();
    no.style.left = R(12, Math.max(13, innerWidth - r.width - 12)) + 'px';
    no.style.top = R(12, Math.max(13, innerHeight - r.height - 12)) + 'px';
  }
  function finalize() {
    no.classList.remove('run'); no.classList.add('final');
    no.style.left = no.style.top = ''; slot.style.width = slot.style.height = '';
    no.style.setProperty('--ns', 1);
    beat.textContent = '♥';
  }
  no.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') dodge(); });
  no.addEventListener('click', () => { if (n >= LIMIT) accept(); else dodge(); });
  yes.addEventListener('click', accept);

  /* ----- accepted: envelope drops in and opens ----- */
  function accept() {
    if (accepted) return;
    accepted = true;
    hearts(40, innerWidth / 2, innerHeight / 2, Math.min(innerWidth, 520) * .6);
    gate.classList.add('gone');
    setTimeout(() => stage.classList.add('show'), 650);
    setTimeout(() => { env.classList.add('open'); burstAtEnv(22); }, 1700);
    setTimeout(() => env.classList.add('out'), 2400);
    setTimeout(() => {
      env.classList.add('reading'); drop.classList.add('lit'); state = 2;
      confetti(); burstAtEnv(40);
    }, 3400);
  }
  env.addEventListener('click', () => { if (state === 2) { confetti(); burstAtEnv(26); } });
</script>
</body>
</html>
